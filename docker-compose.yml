services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigi-calidad-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./database/data:/var/www/html/database/data
      - ./DOCS:/var/www/html/DOCS:ro
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set a non-empty DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
